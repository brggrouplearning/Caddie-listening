<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIẾNG ANH GIAO TIẾP CƠ BẢN CHO CADDIE - LUYỆN TẬP NGHE</title>
    <!-- THƯ VIỆN CHỤP ẢNH MÀN HÌNH HTML2CANVAS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; padding: 15px 10px; background-color: #f8f9fa; margin: 0; color: #333; }
        .brand-header { font-size: 22px; font-weight: 800; color: #B21818; letter-spacing: 1.5px; margin-bottom: 10px; text-transform: uppercase; }
        .container { max-width: 640px; margin: 0 auto; background: white; padding: 20px 15px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        
        h1 { color: #1e7e34; font-size: 18px; margin: 0 0 5px 0; font-weight: bold; text-transform: uppercase; line-height: 1.3; }
        h2 { color: #555; font-size: 12px; margin: 0 0 5px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .lesson-title { color: #0d6efd; font-size: 13.5px; margin: 0 0 12px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

        /* GIAO DIỆN THÔNG TIN HỌC VIÊN SONG NGỮ */
        .user-card { background: #ffffff; border: 2px solid #e7f1ff; border-radius: 12px; padding: 20px; text-align: left; box-shadow: 0 4px 12px rgba(13, 110, 253, 0.05); margin-bottom: 10px; }
        .user-card-header { font-size: 15px; font-weight: bold; color: #0d6efd; border-bottom: 2px solid #e7f1ff; padding-bottom: 8px; margin-bottom: 15px; text-align: center; text-transform: uppercase; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 12px; }
        .form-group.full-width { grid-column: span 2; }
        .form-group label { display: block; font-weight: 600; font-size: 12.5px; color: #495057; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #ced4da; border-radius: 8px; font-size: 13.5px; transition: all 0.2s ease; outline: none; background-color: #fff; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15); }

        .selection-box { background: #f8f9fa; border: 1.5px dashed #b6d4fe; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; transition: border-color 0.2s; }
        .selection-box.active { border-color: #0d6efd; background: #f0f7ff; }
        .selection-header { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 13px; color: #0d6efd; margin-bottom: 6px; cursor: pointer; }
        .selection-header input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #0d6efd; }

        .btn-start-quiz { width: 100%; padding: 13px; font-size: 15px; font-weight: bold; color: white; background: #198754; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(25, 135, 84, 0.25); transition: background 0.2s; }
        .btn-start-quiz:hover { background: #146c43; }

        /* VIEW LÀM BÀI */
        .meta-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
        #item-status { font-size: 12px; font-weight: bold; padding: 5px 12px; border-radius: 15px; text-align: left; }
        .status-answered { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .status-skipped { background-color: #e2e3e5; color: #383d41; border: 1px solid #d6d8db; }
        .status-pending { background-color: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
        .status-correct { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .status-incorrect { background-color: #f8d7da; color: #842029; border: 1px solid #f5c6cb; }

        #timer-box { font-size: 12px; font-weight: bold; color: #0d6efd; background: #e7f1ff; padding: 5px 12px; border-radius: 15px; border: 1px solid #b6d4fe; transition: all 0.3s; white-space: nowrap; }
        .timer-warning { color: #dc3545 !important; background: #f8d7da !important; border-color: #f5c6cb !important; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* KHU VỰC PHÁT ÂM THANH & CÀI ĐẶT GIỌNG ĐỌC */
        .audio-box { background: #e7f1ff; border: 2px dashed #0d6efd; padding: 12px; border-radius: 10px; margin: 10px 0; }
        #play-btn { background: #0d6efd; color: white; padding: 11px 18px; font-size: 14px; font-weight: bold; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.12); transition: all 0.2s; width: 100%; }
        
        .tts-controls { display: flex; gap: 8px; margin-top: 10px; text-align: left; }
        .tts-controls select { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: 1px solid #b6d4fe; background: #fff; font-weight: 600; color: #0d6efd; flex: 1; outline: none; }
        
        .question-title { text-align: left; font-weight: bold; margin-bottom: 10px; color: #212529; font-size: 14.5px; line-height: 1.4; }
        .options-container { display: flex; flex-direction: column; gap: 10px; margin: 12px 0; text-align: left; }
        .option-btn { padding: 11px 14px; font-size: 14px; background: #fff; border: 2px solid #dee2e6; border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s; line-height: 1.4; }
        .option-btn.selected { background-color: #cff4fc !important; border-color: #0dcaf0 !important; font-weight: bold; color: #055160; }
        .option-btn.opt-correct { background-color: #d1e7dd !important; border-color: #198754 !important; color: #0f5132; font-weight: bold; }
        .option-btn.opt-incorrect { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #842029; font-weight: bold; }

        .vi-trans { 
            display: block; 
            margin-top: 5px; 
            font-weight: normal; 
            font-size: 13.5px; 
            color: #495057; 
            line-height: 1.5;
        }

        .fill-container {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px 15px;
            margin: 15px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .blank-sentence {
            font-size: 15.5px;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .fill-input {
            width: 100%;
            max-width: 380px;
            padding: 10px 14px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            color: #0f172a;
            border: 2px solid #0d6efd;
            border-radius: 8px;
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .fill-input:focus {
            background-color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.2);
        }

        .char-hint {
            display: block;
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
        }

        .correct-answer-text {
            display: block;
            margin-top: 10px;
            font-size: 13.5px;
            font-weight: bold;
            padding: 8px;
            border-radius: 6px;
            background-color: #f1f5f9;
        }

        .control-group { display: flex; justify-content: space-between; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .action-btn { padding: 11px 16px; font-size: 13.5px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; flex: 1; min-width: 120px; }
        #prev-btn { background: #fd7e14; color: white; }
        #next-btn { background: #198754; color: white; }
        
        .result-card { text-align: center; }
        .score-box { font-size: 38px; font-weight: bold; color: #1e7e34; margin: 8px 0 4px 0; }
        .level-badge { display: inline-block; padding: 6px 18px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 12px; }
        .level-excellent { background-color: #d1e7dd; color: #0f5132; border: 1px solid #badbcc; }
        .level-passed { background-color: #cff4fc; color: #055160; border: 1px solid #b6effb; }
        .level-needs-improvement { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .stats-box { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; padding: 14px; margin: 15px 0; text-align: left; font-size: 13.5px; line-height: 1.6; }
        
        .feedback-card { background: #fff8e6; border: 1px solid #ffe8a1; border-radius: 10px; padding: 12px 14px; margin-top: 12px; text-align: left; width: 100%; }
        .feedback-card label { font-size: 12.5px; font-weight: bold; color: #8c6d00; display: block; margin-bottom: 6px; }
        .feedback-card textarea { width: 100%; resize: vertical; min-height: 65px; max-height: 140px; padding: 8px 10px; border: 1.5px solid #ffe082; border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; background: #ffffff; }
        .btn-send-feedback { background: #ffc107; color: #000; font-weight: bold; border: none; padding: 9px 12px; border-radius: 6px; cursor: pointer; margin-top: 8px; width: 100%; font-size: 13px; }

        .extra-tools-card { background: #f0f7ff; border: 1.5px solid #b6d4fe; border-radius: 10px; padding: 12px; margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; text-align: left; width: 100%; }
        .extra-tools-title { width: 100%; font-size: 12.5px; font-weight: bold; color: #0d6efd; margin-bottom: 6px; }
        .btn-tool { flex: 1; min-width: 140px; padding: 10px 8px; font-size: 12.5px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .btn-screenshot { background: #0d6efd; color: white; }
        .btn-upload-drive { background: #198754; color: white; }

        .action-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; flex-wrap: wrap; }
        .btn-review { background: #17a2b8; color: white; flex: 1; padding: 11px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; min-width: 130px; }
        .btn-retry { background: #6c757d; color: white; flex: 1; padding: 11px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; min-width: 130px; }

        .hidden { display: none !important; }
        #save-status-msg { font-size: 12.5px; font-weight: bold; color: #0f5132; margin-top: 8px; background: #d1e7dd; padding: 8px 14px; border-radius: 20px; display: inline-block; border: 1px solid #badbcc; }
    </style>
</head>
<body>

    <div class="brand-header">BRG LEARNING</div>

    <div class="container" id="main-container">
        <h1>TIẾNG ANH GIAO TIẾP CƠ BẢN CHO CADDIE</h1>
        <h2>LUYỆN TẬP KỸ NĂNG NGHE (LISTENING PRACTICE)</h2>
        <h3 id="lesson-title" class="lesson-title">ĐANG TẢI BÀI HỌC...</h3>
        
        <!-- BƯỚC 1: THÔNG TIN HỌC VIÊN -->
        <div id="user-info-view" class="user-card">
            <div class="user-card-header">📋 THÔNG TIN HỌC VIÊN / STUDENT INFORMATION</div>
            
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="work-place">1. Nơi làm việc / Work place (*):</label>
                    <select id="work-place">
                        <option value="">-- Chọn đơn vị làm việc / Select Work Place --</option>
                        <option value="KI">KINGS ISLAND</option>
                        <option value="LH">LEGEND HILL</option>
                        <option value="RT">RUBY TREE</option>
                        <option value="LV">LEGEND VALLEY</option>
                        <option value="LDN">LEGEND DANANG</option>
                        <option value="GS">GOLDEN SANDS</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="student-name">2. Họ Và Tên / Full name (*):</label>
                    <input type="text" id="student-name" placeholder="Nhập họ và tên đầy đủ / Enter your full name">
                </div>

                <div class="form-group">
                    <label for="staff-number">3. Mã Nhân viên / Staff ID (*):</label>
                    <input type="text" id="staff-number" placeholder="Ví dụ / e.g. 123, 435">
                </div>

                <div class="form-group">
                    <label for="birthday-date">4. Ngày sinh / Date of birth (*):</label>
                    <input type="date" id="birthday-date" max="2008-08-03" min="1926-01-01">
                </div>

                <div class="form-group full-width">
                    <label for="department">5. Bộ phận, Phòng, Ban / Department, Division (*):</label>
                    <select id="department">
                        <option value="">-- Chọn bộ phận / Select Department --</option>
                        <option value="Caddie">Caddie</option>
                        <option value="Marshal">Marshal</option>
                        <option value="Starter">Starter</option>
                        <option value="Valet">Valet</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- LỰA CHỌN 1 TRONG 2 -->
                <div class="form-group full-width">
                    <label style="color: #0d6efd; font-weight: bold; margin-bottom: 8px;">NỘI DUNG THI / EXAM CONTENT (Chọn 1 trong 2):</label>

                    <div class="selection-box" id="box-section">
                        <label class="selection-header">
                            <input type="radio" name="content_mode" value="section" id="mode-section" onclick="toggleContentMode('section')">
                            <span>6. Bài luyện tập (Lesson / Section)</span>
                        </label>
                        <select id="select-section" disabled onchange="syncRadioOnSelect('section')">
                            <option value="">-- Chọn Chuyên đề Luyện tập --</option>
                            <option value="1.1">section 1.1: Bảng chữ cái tiếng anh</option>
                            <option value="1.2">section 1.2: Giới thiệu bản thân</option>
                            <option value="1.3">section 1.3: Số đếm</option>
                            <option value="1.4">section 1.4: Sở thích</option>
                            <option value="1.5">section 1.5: Thực hành & luyện tập</option>
                            <option value="2.1">section 2.1: Thời tiết</option>
                            <option value="2.2">section 2.2: Mùa</option>
                            <option value="2.3">section 2.3: Thực hành & luyện tập</option>
                            <option value="3.1">section 3.1: Mô tả vị trí</option>
                            <option value="3.2">section 3.2: Mô tả hướng</option>
                            <option value="3.3">section 3.3: Giới thiệu trên sân</option>
                            <option value="3.4">section 3.4: Thực hành & luyện tập</option>
                            <option value="4.1">section 4.1: Màu sắc</option>
                            <option value="4.2">section 4.2: Giao tiếp cơ bản</option>
                            <option value="4.3">section 4.3: Thực hành & luyện tập</option>
                            <option value="5.1">section 5.1: Lời than phiền</option>
                            <option value="5.2">section 5.2: Lời đề nghị</option>
                            <option value="5.3">section 5.3: Động viên, khích lệ</option>
                            <option value="5.4">section 5.4: Lời chào tạm biệt</option>
                            <option value="5.5">section 5.5: Thực hành & luyện tập</option>
                            <option value="6.1">section 6.1: Sức khoẻ</option>
                            <option value="6.2">section 6.2: Cảm xúc</option>
                            <option value="6.3">section 6.3: Tình huống khẩn cấp</option>
                            <option value="6.4">section 6.4: Thực hành & luyện tập</option>
                        </select>
                    </div>

                    <div class="selection-box" id="box-exam">
                        <label class="selection-header">
                            <input type="radio" name="content_mode" value="exam" id="mode-exam" onclick="toggleContentMode('exam')">
                            <span>7. Bài thi / Kiểm tra (Exam / Test)</span>
                        </label>
                        <select id="select-exam" disabled onchange="syncRadioOnSelect('exam')">
                            <option value="">-- Chọn Bài thi / Kiểm tra --</option>
                            <option value="1">exam 1: Giai đoạn 1 (Lesson 1)</option>
                            <option value="2-3">exam 2: Giai đoạn 2 (Lesson 2-3)</option>
                            <option value="4">exam 3: Giai đoạn 3 (Lesson 4)</option>
                            <option value="5-6">exam 4: Giai đoạn 4 (Lesson 5-6)</option>
                            <option value="all">final exam: Cuối khóa (Tất cả chuyên đề)</option>
                        </select>
                    </div>
                </div>
            </div>

            <p id="user-info-error" style="color: #dc3545; font-size: 13px; font-weight: bold; margin: 5px 0 0 0; display: none;"></p>
            <button class="btn-start-quiz" onclick="startQuizPractice()">BẮT ĐẦU LÀM BÀI / START TEST 🚀</button>
        </div>

        <!-- BƯỚC 2: MÀN HÌNH LÀM BÀI -->
        <div id="quiz-area" class="hidden">
            <div class="meta-bar" id="top-meta-bar">
                <div id="item-status" class="status-pending">⏳ Trạng thái: Chưa hoàn thành</div>
                <div id="timer-box">⏳ Thời gian làm bài: <span id="time-left">00:00</span></div>
            </div>

            <div class="audio-box">
                <button id="play-btn" onclick="playAudio()">🔊 NGHE CÂU HỎI</button>
                <div class="tts-controls">
                    <select id="speech-voice-select" title="Chọn giọng đọc"></select>
                    <select id="speech-rate-select" title="Chọn tốc độ đọc">
                        <option value="0.70">🐢 Rất chậm (0.70x)</option>
                        <option value="0.78" selected>🚶 Chậm rõ ràng (0.78x)</option>
                        <option value="0.85">🏃 Vừa phải (0.85x)</option>
                        <option value="1.00">⚡ Bình thường (1.00x)</option>
                    </select>
                </div>
            </div>

            <div id="question-title" class="question-title">...</div>
            
            <div id="mcq-container" class="options-container"></div>

            <div id="fill-container" class="fill-container" style="display:none;">
                <div id="blank-sentence" class="blank-sentence"></div>
                <div>
                    <input type="text" id="fill-input" class="fill-input" placeholder="Nhập từ còn thiếu..." oninput="saveFillAnswer(this.value)" onkeydown="handleFillKeydown(event)">
                </div>
                <span id="char-hint" class="char-hint"></span>
                <span id="correct-answer-display" class="correct-answer-text" style="display:none;"></span>
            </div>

            <div class="control-group">
                <button id="prev-btn" class="action-btn" onclick="goToPrevious()">⏮️ Câu trước</button>
                <button id="next-btn" class="action-btn" onclick="goToNext()">Câu tiếp ⏩</button>
            </div>
            <p id="status"></p>
        </div>

        <!-- BƯỚC 3: MÀN HÌNH TỔNG KẾT & GÓP Ý -->
        <div id="result-view" class="hidden"></div>

        <!-- BƯỚC 4: MÀN HÌNH XEM LẠI BÀI LÀM -->
        <div id="review-view" class="hidden"></div>
    </div>

    <!-- KHỞI TẠO MẢNG DỮ LIỆU CHUNG -->
    <script> window.masterQuizData = []; </script>

    <!-- SCRIPT LOADING TỰ ĐỘNG DỮ LIỆU -->
    <script>
        (function loadAllDataFiles() {
            const filesToLoad = ['data/exams.js'];
            for (let i = 1; i <= 10; i++) {
                filesToLoad.push(`data/lesson${i}.js`);
            }

            let loadedCount = 0;
            let isInitialized = false;

            const checkAndInit = () => {
                if (isInitialized) return;
                isInitialized = true;
                if (typeof initApp === 'function') initApp();
            };

            filesToLoad.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                script.onload = script.onerror = () => {
                    loadedCount++;
                    if (loadedCount === filesToLoad.length) {
                        checkAndInit();
                    }
                };
                document.head.appendChild(script);
            });
        })();
    </script>

    <!-- CORE ENGINE LUYỆN NGHE -->
    <script>
        // ĐƯỜNG LINK GOOGLE APPS SCRIPT WEB APP MỚI
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzb4U5YUrXkX5jxtroz9IV5L2qgMuA4289UqZKrryc7-fyn_PzEnL28VtJp2pqs9voV/exec';

        let studentInfo = {
            workPlace: '',
            studentName: '',
            staffNumber: '',
            birthday: '',
            department: '',
            rawLessonCode: '',
            lessonTitle: ''
        };

        let lastSessionMessage = "";

        function toggleContentMode(mode) {
            const radioSection = document.getElementById('mode-section');
            const radioExam = document.getElementById('mode-exam');
            const selectSection = document.getElementById('select-section');
            const selectExam = document.getElementById('select-exam');
            const boxSection = document.getElementById('box-section');
            const boxExam = document.getElementById('box-exam');

            if (mode === 'section') {
                radioSection.checked = true;
                selectSection.disabled = false;
                boxSection.classList.add('active');

                radioExam.checked = false;
                selectExam.disabled = true;
                selectExam.value = "";
                boxExam.classList.remove('active');
            } else if (mode === 'exam') {
                radioExam.checked = true;
                selectExam.disabled = false;
                boxExam.classList.add('active');

                radioSection.checked = false;
                selectSection.disabled = true;
                selectSection.value = "";
                boxSection.classList.remove('active');
            }
        }

        function syncRadioOnSelect(mode) { toggleContentMode(mode); }

        function convertToNonAccent(str) {
            if (!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                      .replace(/đ/g, "d").replace(/Đ/g, "D")
                      .replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
        }

        function cleanSectionCode(secStr) {
            if (secStr === null || secStr === undefined) return "";
            return secStr.toString().toLowerCase().replace(/section/gi, '').replace(/\s+/g, '').trim();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function fixStuckText(text) {
            if (!text) return "";
            return text.normalize('NFC').replace(/\s+/g, ' ').trim();
        }

        function getFilteredListeningItemsBySelection(isSectionMode, selectedVal) {
            let rawPool = (window.masterQuizData && window.masterQuizData.length > 0) ? JSON.parse(JSON.stringify(window.masterQuizData)) : [];
            let filtered = [];
            let targetCount = 30; 
            let titleBanner = "LUYỆN NGHE TỔNG HỢP";

            if (isSectionMode && selectedVal) {
                titleBanner = `LUYỆN NGHE - SECTION ${selectedVal}`;
                let cleanTarget = cleanSectionCode(selectedVal);
                filtered = rawPool.filter(q => q.section && cleanSectionCode(q.section) === cleanTarget);
                targetCount = 30;
            } else if (!isSectionMode && selectedVal) {
                if (selectedVal === 'all') {
                    titleBanner = "KIỂM TRA NGHE CUỐI KHÓA - FINAL EXAM";
                    filtered = [...rawPool];
                    targetCount = 50;
                } else {
                    titleBanner = `KIỂM TRA NGHE - EXAM ${selectedVal}`;
                    let examLessons = selectedVal.split('-').map(n => n.trim());
                    filtered = rawPool.filter(q => {
                        let qLes = (q.lesson || "").toString().replace(/[^\d]/g, '');
                        return examLessons.includes(qLes);
                    });
                    targetCount = 50;
                }
            }

            const subTitleElem = document.getElementById('lesson-title');
            if (subTitleElem) subTitleElem.innerText = titleBanner;

            filtered.forEach(item => {
                if (item.translation) {
                    item.translation = fixStuckText(item.translation.replace(/\+\]/gi, '').replace(/cite:\s*[\d,\s]+/gi, '').trim());
                }
                if (item.options && Array.isArray(item.options)) {
                    item.options.forEach(opt => {
                        if (opt.en) opt.en = fixStuckText(opt.en);
                        if (opt.vi) opt.vi = fixStuckText(opt.vi);
                    });

                    // XÁO TRỘN ĐÁP ÁN (MCQ) VÀ CẬP NHẬT LẠI CHỈ SỐ ĐÁP ÁN ĐÚNG
                    if (item.type === "mcq" && typeof item.correct === 'number') {
                        let correctOptionObj = item.options[item.correct];
                        shuffleArray(item.options);
                        // Tìm lại vị trí mới của đáp án đúng sau khi xáo trộn
                        item.correct = item.options.findIndex(opt => opt === correctOptionObj);
                    }
                }
            });

            if (filtered.length === 0) {
                document.getElementById('question-title').innerText = "⚠️ Chưa có dữ liệu câu hỏi nghe cho bài đã chọn!";
                return [];
            }

            // Xáo trộn thứ tự các câu hỏi trong đề thi
            shuffleArray(filtered);
            return filtered.slice(0, Math.min(targetCount, filtered.length));
        }

        let quizData = [];
        const MAX_LISTEN_PER_QUESTION = 3; 
        const DELAY_BEFORE_AUDIO_MS = 1000; 
        let autoPlayTimer = null; 

        let listenCounts = []; 
        let userAnswers = [];
        let currentIndex = 0;
        let isReviewMode = false;

        let totalSeconds = 0; 
        let initialSeconds = 0;
        let elapsedSeconds = 0; 
        let timerInterval = null;
        let startTimeFormatted = "";
        let lastSavedPayload = null;

        /* LOAD DANH SÁCH GIỌNG ĐỌC CÓ SẴN TRÊN TRÌNH DUYỆT */
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voiceSelect = document.getElementById('speech-voice-select');
            if (!voiceSelect) return;

            const voices = window.speechSynthesis.getVoices();
            const enVoices = voices.filter(v => v.lang.startsWith('en'));

            voiceSelect.innerHTML = '';
            if (enVoices.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.innerText = "Giọng mặc định hệ thống";
                voiceSelect.appendChild(opt);
                return;
            }

            enVoices.forEach((voice, index) => {
                const opt = document.createElement('option');
                opt.value = voice.name;
                
                let label = voice.name;
                if (voice.name.includes('Natural')) label = '🌟 ' + voice.name + ' (Tự nhiên)';
                else if (voice.name.includes('Google')) label = '🎙️ ' + voice.name;
                else if (voice.name.includes('Samantha') || voice.name.includes('Karen') || voice.name.includes('Jenny') || voice.name.includes('Guy')) {
                    label = '🔊 ' + voice.name;
                }
                
                opt.innerText = label;
                voiceSelect.appendChild(opt);
            });

            // Ưu tiên tự chọn giọng Natural/Google/Samantha
            const bestVoiceIndex = enVoices.findIndex(v => 
                v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Jenny')
            );
            if (bestVoiceIndex !== -1) {
                voiceSelect.selectedIndex = bestVoiceIndex;
            }
        }

        function initApp() {
            loadVoices();
        }

        function startQuizPractice() {
            const workPlace = document.getElementById('work-place').value;
            const studentName = document.getElementById('student-name').value.trim();
            const staffNumber = document.getElementById('staff-number').value.trim();
            const birthdayDate = document.getElementById('birthday-date').value;
            const department = document.getElementById('department').value;
            const errorElem = document.getElementById('user-info-error');

            const isSectionMode = document.getElementById('mode-section').checked;
            const isExamMode = document.getElementById('mode-exam').checked;
            const selectedSection = document.getElementById('select-section').value;
            const selectedExam = document.getElementById('select-exam').value;

            if (!workPlace || !studentName || !staffNumber || !birthdayDate || !department) {
                errorElem.innerText = "⚠️ Vui lòng điền đầy đủ thông tin học viên / Please fill in all required fields (*)!";
                errorElem.style.display = "block";
                return;
            }

            if (birthdayDate) {
                const birthYear = new Date(birthdayDate).getFullYear();
                const currentYear = new Date().getFullYear();
                const age = currentYear - birthYear;
                if (isNaN(age) || age < 18 || birthYear > currentYear) {
                    errorElem.innerText = "⚠️ Ngày sinh không hợp lệ! Học viên phải từ 18 tuổi trở lên.";
                    errorElem.style.display = "block";
                    return;
                }
            }

            if (!isSectionMode && !isExamMode) {
                errorElem.innerText = "⚠️ Vui lòng chọn Mục 6 (Bài luyện tập) hoặc Mục 7 (Bài thi/kiểm tra)!";
                errorElem.style.display = "block";
                return;
            }

            if (isSectionMode && !selectedSection) {
                errorElem.innerText = "⚠️ Vui lòng chọn một Chuyên đề Luyện tập ở Mục 6!";
                errorElem.style.display = "block";
                return;
            }

            if (isExamMode && !selectedExam) {
                errorElem.innerText = "⚠️ Vui lòng chọn một Bài thi / Kiểm tra ở Mục 7!";
                errorElem.style.display = "block";
                return;
            }

            errorElem.style.display = "none";

            studentInfo.workPlace = workPlace;
            studentInfo.studentName = studentName;
            studentInfo.staffNumber = staffNumber;
            studentInfo.birthday = birthdayDate;
            studentInfo.department = department;
            studentInfo.rawLessonCode = isSectionMode ? ("section" + selectedSection) : (selectedExam === 'all' ? 'examall' : 'exam' + selectedExam);

            const selectedVal = isSectionMode ? selectedSection : selectedExam;
            quizData = getFilteredListeningItemsBySelection(isSectionMode, selectedVal);
            if (quizData.length === 0) return;

            studentInfo.lessonTitle = document.getElementById('lesson-title') ? document.getElementById('lesson-title').innerText : 'Luyện nghe';

            listenCounts = new Array(quizData.length).fill(0);
            userAnswers = new Array(quizData.length).fill(null);
            currentIndex = 0;

            initialSeconds = Math.round(quizData.length * 45); 
            totalSeconds = initialSeconds;

            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            const dateStr = now.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
            startTimeFormatted = `${timeStr}, ngày ${dateStr}`;

            document.getElementById('user-info-view').classList.add('hidden');
            document.getElementById('quiz-area').classList.remove('hidden');

            startTotalTimer();
            loadQuestion();
        }

        function highlightWrongWords(userText, correctText) {
            if (!userText) return "";
            const userWords = userText.split(" ");
            const correctWords = correctText.split(" ");

            return userWords.map((word, idx) => {
                const cleanUserWord = word.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                const cleanCorrectWord = correctWords[idx] ? correctWords[idx].replace(/[^a-zA-Z0-9]/g, "").toLowerCase() : "";

                if (cleanUserWord !== cleanCorrectWord && cleanUserWord !== "") {
                    return `<span class="wrong-word-highlight">${word}</span>`;
                }
                return word;
            }).join(" ");
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            let res = "";
            if (mins > 0) res += `${mins} phút `;
            res += `${secs.toString().padStart(2, '0')} giây`;
            return res;
        }

        function startTotalTimer() {
            const timerBox = document.getElementById('timer-box');
            const timeLeftElem = document.getElementById('time-left');

            if (timeLeftElem) timeLeftElem.innerText = formatTime(totalSeconds);

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    elapsedSeconds++;
                    if (timeLeftElem) timeLeftElem.innerText = formatTime(totalSeconds);

                    if (totalSeconds <= 120 && timerBox) {
                        timerBox.classList.add('timer-warning');
                    }
                } else {
                    clearInterval(timerInterval);
                    clearTimeout(autoPlayTimer);
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                    finishSession("⏰ ĐÃ HẾT THỜI GIAN LÀM BÀI!");
                }
            }, 1000);
        }

        function updateItemStatusTag() {
            const statusTag = document.getElementById('item-status');
            if (!statusTag) return;
            const userAns = userAnswers[currentIndex];
            const currentQuiz = quizData[currentIndex];

            if (!isReviewMode) {
                if (userAns !== null && userAns !== "") {
                    statusTag.className = "status-answered";
                    statusTag.innerText = "🔒 Trạng thái: Đã trả lời";
                } else {
                    statusTag.className = "status-pending";
                    statusTag.innerText = "⏳ Trạng thái: Chưa hoàn thành";
                }
            } else {
                if (userAns === null || userAns === "") {
                    statusTag.className = "status-skipped";
                    statusTag.innerText = "⏭️ Trạng thái: Đã bỏ qua";
                } else {
                    let isCorrect = false;
                    if (currentQuiz.type === 'mcq') {
                        isCorrect = (userAns === currentQuiz.correct);
                    } else if (currentQuiz.type === 'fill') {
                        isCorrect = (userAns.toLowerCase() === currentQuiz.targetWord.toLowerCase());
                    }

                    if (isCorrect) {
                        statusTag.className = "status-correct";
                        statusTag.innerText = "✅ Trạng thái: Chính xác";
                    } else {
                        statusTag.className = "status-incorrect";
                        statusTag.innerText = "❌ Trạng thái: Chưa chính xác";
                    }
                }
                updatePlayButtonState();
            }
        }

        function loadQuestion() {
            clearTimeout(autoPlayTimer); 

            if (currentIndex < quizData.length) {
                const statusElem = document.getElementById('status');
                if (statusElem) statusElem.innerText = "";
                
                updateItemStatusTag();

                const currentQuiz = quizData[currentIndex];
                document.getElementById('question-title').innerText = `Câu ${currentIndex + 1}/${quizData.length}: ${currentQuiz.title}`;

                const mcqContainer = document.getElementById('mcq-container');
                const fillContainer = document.getElementById('fill-container');
                const correctDisplay = document.getElementById('correct-answer-display');

                if (currentQuiz.type === "mcq") {
                    mcqContainer.style.display = "flex";
                    fillContainer.style.display = "none";
                    mcqContainer.innerHTML = "";

                    const correctObj = currentQuiz.options[currentQuiz.correct];

                    currentQuiz.options.forEach((optObj, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'option-btn';
                        
                        let displayEnText = optObj.en;

                        if (!isReviewMode) {
                            if (userAnswers[currentIndex] === index) {
                                btn.classList.add('selected');
                            }
                            btn.onclick = () => selectMcqOption(index);
                        } else {
                            btn.disabled = true;
                            if (index === currentQuiz.correct) {
                                btn.classList.add('opt-correct');
                            }
                            if (userAnswers[currentIndex] === index && index !== currentQuiz.correct) {
                                btn.classList.add('opt-incorrect');
                                displayEnText = highlightWrongWords(optObj.en, correctObj.en);
                            }
                        }

                        btn.innerHTML = `<span>${displayEnText}</span><span class="vi-trans">${optObj.vi}</span>`;
                        mcqContainer.appendChild(btn);
                    });
                } 
                else if (currentQuiz.type === "fill") {
                    mcqContainer.style.display = "none";
                    fillContainer.style.display = "block";

                    document.getElementById('blank-sentence').innerHTML = `
                        ${currentQuiz.displaySentence}
                        <span class="vi-trans">${currentQuiz.translation || ""}</span>
                    `;

                    if (currentQuiz.hint) {
                        let cleanHint = currentQuiz.hint.replace(/^💡\s*/, '').replace(/^Gợi ý:\s*/i, '').trim();
                        document.getElementById('char-hint').innerText = `💡 Gợi ý: ${cleanHint}`;
                    } else {
                        document.getElementById('char-hint').innerText = "";
                    }

                    const fillInput = document.getElementById('fill-input');
                    fillInput.value = userAnswers[currentIndex] || "";

                    if (isReviewMode) {
                        fillInput.disabled = true;
                        correctDisplay.style.display = "block";
                        
                        const userVal = userAnswers[currentIndex] || "";
                        if (userVal.toLowerCase() === currentQuiz.targetWord.toLowerCase()) {
                            correctDisplay.innerHTML = "<span style='color:#198754;'>🎯 Đáp án đúng: " + currentQuiz.targetWord + "</span>";
                        } else {
                            const wrongWordFormatted = userVal !== "" 
                                ? `<span class="wrong-word-highlight">${userVal}</span>` 
                                : `<span class="wrong-word-highlight">(Bỏ trống)</span>`;
                            correctDisplay.innerHTML = `<span style='color:#dc3545;'>❌ Bạn nhập sai: ${wrongWordFormatted}</span> <br>🎯 Đáp án chính xác: <b style="color:#198754;">${currentQuiz.targetWord}</b>`;
                        }
                    } else {
                        fillInput.disabled = false;
                        correctDisplay.style.display = "none";
                        setTimeout(() => fillInput.focus(), 100);
                    }
                }

                document.getElementById('prev-btn').style.display = (currentIndex === 0) ? 'none' : 'block';

                const nextBtn = document.getElementById('next-btn');
                if (currentIndex === quizData.length - 1) {
                    nextBtn.innerText = isReviewMode ? "Hoàn tất xem lại 🏁" : "Nộp bài 🏆";
                } else {
                    nextBtn.innerText = "Câu tiếp ⏩";
                }

                updatePlayButtonState();

                if (listenCounts[currentIndex] === 0 && !isReviewMode) {
                    autoPlayTimer = setTimeout(playAudio, DELAY_BEFORE_AUDIO_MS);
                }

            } else {
                if (isReviewMode) {
                    finishSession(lastSessionMessage || "🎉 HOÀN THÀNH BÀI KIỂM TRA NGHE!", true);
                } else {
                    clearInterval(timerInterval);
                    finishSession("🎉 HOÀN THÀNH BÀI KIỂM TRA NGHE!");
                }
            }
        }

        function updatePlayButtonState() {
            const playBtn = document.getElementById('play-btn');
            if (!playBtn) return;
            const used = listenCounts[currentIndex];
            const remaining = MAX_LISTEN_PER_QUESTION - used;

            if (isReviewMode) {
                playBtn.disabled = false;
                playBtn.innerText = `🔊 NGHE LẠI ÂM THANH (CÂU ${currentIndex + 1}/${quizData.length})`;
            } else {
                if (remaining > 0) {
                    playBtn.disabled = false;
                    playBtn.innerText = `🔊 NGHE CÂU HỎI (CÂU ${currentIndex + 1}/${quizData.length} - Còn ${remaining} lượt)`;
                } else {
                    playBtn.disabled = true;
                    playBtn.innerText = `🚫 ĐÃ HẾT LƯỢT NGHE (CÂU ${currentIndex + 1}/${quizData.length})`;
                }
            }
        }

        /* HÀM XỬ LÝ CHUYÊN SÂU PHÁT ÂM TÊN RIÊNG & GIỌNG ĐỌC TỰ NHIÊN RÕ RÀNG */
        function formatAudioTextForClearPronunciation(text) {
            if (!text) return "";
            
            // 1. Tách chuỗi thành các từ để nhận diện Tên Riêng (Từ viết hoa giữa câu)
            const words = text.split(' ');
            const processedWords = words.map((word, idx) => {
                // Kiểm tra từ có viết hoa chữ cái đầu và không phải từ đầu câu
                const cleanWord = word.replace(/[^a-zA-Z]/g, '');
                const isProperName = (idx > 0) && cleanWord.length > 1 && /^[A-Z][a-z]+$/.test(cleanWord);
                
                if (isProperName) {
                    // Chèn dấu phẩy tạo khoảng nghỉ ngắn trước & sau tên riêng giúp máy đọc chậm, to và rõ hơn
                    return `, ${word}, `;
                }
                return word;
            });

            let formatted = processedWords.join(' ');

            // 2. Tối ưu hóa các tên riêng hoặc danh từ phổ biến trong ngành Golf / Caddie
            formatted = formatted.replace(/\bMr\./gi, "Mr. ")
                                 .replace(/\bMrs\./gi, "Mrs. ")
                                 .replace(/\bMs\./gi, "Ms. ")
                                 .replace(/\bHole\s+(\d+)/gi, "Hole , $1")
                                 .replace(/\bPar\s+(\d+)/gi, "Par , $1");

            return formatted;
        }

        function playAudio() {
            clearTimeout(autoPlayTimer); 

            if (!isReviewMode && listenCounts[currentIndex] >= MAX_LISTEN_PER_QUESTION) {
                document.getElementById('status').innerText = "⚠️ Bạn đã dùng hết số lượt nghe cho câu này!";
                return;
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const currentQuiz = quizData[currentIndex];
                // Tối ưu chuỗi âm thanh để tên riêng được nhả chữ chậm và rõ ràng hơn
                const textToRead = formatAudioTextForClearPronunciation(currentQuiz.audioText);

                const utterance = new SpeechSynthesisUtterance(textToRead);
                utterance.lang = 'en-US';

                // Lấy tốc độ người dùng chọn (Mặc định 0.78x để nghe chậm và rõ)
                const rateElem = document.getElementById('speech-rate-select');
                utterance.rate = rateElem ? parseFloat(rateElem.value) : 0.78; 
                utterance.pitch = 1.0; 
                utterance.volume = 1.0; // Âm lượng tối đa để tiếng to và rõ ràng

                // Lựa chọn giọng đọc người dùng đã chọn hoặc tự chọn giọng Natural/Google
                const voices = window.speechSynthesis.getVoices();
                const selectedVoiceName = document.getElementById('speech-voice-select')?.value;
                
                let chosenVoice = voices.find(v => v.name === selectedVoiceName);

                if (!chosenVoice) {
                    chosenVoice = voices.find(v => 
                        (v.lang === 'en-US' || v.lang === 'en_US') && 
                        (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Jenny'))
                    ) || voices.find(v => v.lang.startsWith('en'));
                }

                if (chosenVoice) {
                    utterance.voice = chosenVoice;
                }

                window.speechSynthesis.speak(utterance);
                
                if (!isReviewMode) {
                    listenCounts[currentIndex]++;
                    updatePlayButtonState();
                }
                
                document.getElementById('status').innerText = "🔊 Đang phát âm thanh...";
            }
        }

        function selectMcqOption(selectedIndex) {
            if (isReviewMode) return;
            userAnswers[currentIndex] = selectedIndex;
            updateItemStatusTag();
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, idx) => {
                if (idx === selectedIndex) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
            document.getElementById('status').innerText = "Đã ghi nhận lựa chọn. Bấm 'Câu tiếp' để tiếp tục.";
        }

        function saveFillAnswer(val) {
            if (isReviewMode) return;
            userAnswers[currentIndex] = val.trim();
            updateItemStatusTag();
        }

        function handleFillKeydown(event) {
            if (event.isComposing || event.keyCode === 229) return;

            if (event.key === 'Enter') {
                event.preventDefault(); 
                saveFillAnswer(event.target.value); 
                goToNext(); 
            }
        }

        function goToNext() {
            clearTimeout(autoPlayTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            
            if (isReviewMode && currentIndex === quizData.length - 1) {
                finishSession(lastSessionMessage || "🎉 HOÀN THÀNH BÀI KIỂM TRA NGHE!", true);
                return;
            }

            currentIndex++;
            loadQuestion();
        }

        function goToPrevious() {
            clearTimeout(autoPlayTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            if (currentIndex > 0) {
                currentIndex--;
                loadQuestion();
            }
        }

        function sendResultToGoogleSheet(payload, isFeedback = false) {
            if (!GOOGLE_SCRIPT_URL) return;

            const msgElem = document.getElementById('save-status-msg');

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Error sending data:", err));

            if (msgElem) {
                if (isFeedback) {
                    msgElem.innerText = "✅ Cảm ơn bạn đã góp ý/đề xuất! / Thank you for your feedback!";
                    msgElem.style.color = "#0f5132";
                    msgElem.style.backgroundColor = "#d1e7dd";
                } else {
                    msgElem.innerText = "✅ Đã lưu kết quả thi thành công!";
                    msgElem.style.color = "#0f5132";
                    msgElem.style.backgroundColor = "#d1e7dd";
                }
            }
        }

        function sendFeedbackOnly() {
            if (!lastSavedPayload) return;
            const fbTextarea = document.getElementById('user-feedback');
            const fbBtn = document.querySelector('.btn-send-feedback');
            const fbText = fbTextarea ? fbTextarea.value.trim() : '';

            if (!fbText) {
                alert("Vui lòng nhập nội dung góp ý trước khi gửi / Please enter your comment!");
                return;
            }

            lastSavedPayload.feedback = fbText;

            if (fbTextarea) fbTextarea.disabled = true;
            if (fbBtn) {
                fbBtn.disabled = true;
                fbBtn.innerText = "✔ Đã gửi góp ý / Sent";
                fbBtn.style.opacity = "0.6";
                fbBtn.style.cursor = "not-allowed";
            }

            sendResultToGoogleSheet(lastSavedPayload, true);
        }

        function captureResultScreenshot() {
            const resultElem = document.getElementById('main-container');
            if (!resultElem) return;

            const workPlaceCode = studentInfo.workPlace || "BRG";
            const studentNameRaw = studentInfo.studentName || "hocvien";
            const staffId = studentInfo.staffNumber || "000";
            const birthDateRaw = studentInfo.birthday || "2000-01-01";

            const birthYear = birthDateRaw.split('-')[0] || "2000";
            const cleanName = convertToNonAccent(studentNameRaw);

            const now = new Date();
            const yearStr = now.getFullYear();
            const monthStr = String(now.getMonth() + 1).padStart(2, '0');
            const dayStr = String(now.getDate()).padStart(2, '0');
            const hourStr = String(now.getHours()).padStart(2, '0');
            const minStr = String(now.getMinutes()).padStart(2, '0');

            const fileName = `${workPlaceCode}_${yearStr}${monthStr}${dayStr}_${hourStr}${minStr}_${cleanName}_${staffId}_${birthYear}.jpg`;

            html2canvas(resultElem, { scale: 1.2, useCORS: true }).then(canvas => {
                const imageQuality = 0.65;
                const imageBase64 = canvas.toDataURL("image/jpeg", imageQuality);

                const link = document.createElement('a');
                link.download = fileName;
                link.href = imageBase64;
                link.click();
            });
        }

        function uploadResultToDrive() {
            const resultElem = document.getElementById('main-container');
            const statusBtn = document.getElementById('btn-drive-status');
            if (!resultElem) return;

            if (statusBtn) {
                statusBtn.innerText = "⏳ Đang tải ảnh lên Cloud (Drive)...";
                statusBtn.disabled = true;
            }

            const workPlaceMap = {
                'KI': 'KINGS ISLAND',
                'LH': 'LEGEND HILL',
                'RT': 'RUBY TREE',
                'LV': 'LEGEND VALLEY',
                'LDN': 'LEGEND DANANG',
                'GS': 'GOLDEN SANDS'
            };

            const workPlaceCode = studentInfo.workPlace || "KI";
            const fullWorkPlace = workPlaceMap[workPlaceCode] || "KINGS ISLAND";
            const studentNameRaw = studentInfo.studentName || "hocvien";
            const staffId = studentInfo.staffNumber || "000";
            const birthDateRaw = studentInfo.birthday || "2000-01-01";

            const birthYear = birthDateRaw.split('-')[0] || "2000";
            const cleanName = convertToNonAccent(studentNameRaw);

            const now = new Date();
            const yearStr = now.getFullYear();
            const monthStr = String(now.getMonth() + 1).padStart(2, '0');
            const dayStr = String(now.getDate()).padStart(2, '0');
            const hourStr = String(now.getHours()).padStart(2, '0');
            const minStr = String(now.getMinutes()).padStart(2, '0');

            const fileName = `${workPlaceCode}_${yearStr}${monthStr}${dayStr}_${hourStr}${minStr}_${cleanName}_${staffId}_${birthYear}.jpg`;
            const dateFolderStr = `${yearStr}.${monthStr}.${dayStr}`;
            let rawLessonCode = studentInfo.rawLessonCode.toUpperCase();

            html2canvas(resultElem, { scale: 1.2, useCORS: true }).then(canvas => {
                const imageBase64 = canvas.toDataURL("image/jpeg", 0.65);

                const payload = {
                    action: "upload_image",
                    imageBase64: imageBase64,
                    fileName: fileName,
                    fullWorkPlace: fullWorkPlace,
                    dateFolderStr: dateFolderStr,
                    rawLessonCode: rawLessonCode
                };

                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    if (statusBtn) {
                        statusBtn.innerText = "✅ Đã tải ảnh lên Drive thành công!";
                        statusBtn.style.backgroundColor = "#198754";
                    }
                }).catch(err => {
                    if (statusBtn) {
                        statusBtn.innerText = "❌ Lỗi tải ảnh lên Drive";
                        statusBtn.disabled = false;
                    }
                });
            });
        }

        function finishSession(message, isFromReview = false) {
            clearInterval(timerInterval);
            clearTimeout(autoPlayTimer);
            isReviewMode = false;
            lastSessionMessage = message;

            let correctCount = 0;
            let incorrectCount = 0;
            let skippedCount = 0;
            let totalItems = quizData.length;

            quizData.forEach((item, index) => {
                const userAns = userAnswers[index];
                if (userAns === null || userAns === "") {
                    skippedCount++;
                } else if (item.type === "mcq") {
                    if (userAns === item.correct) correctCount++;
                    else incorrectCount++;
                } else if (item.type === "fill") {
                    if (userAns.toLowerCase() === item.targetWord.toLowerCase()) correctCount++;
                    else incorrectCount++;
                }
            });

            let calculatedScore = 0;
            if (totalItems > 0) {
                calculatedScore = Math.round((correctCount / totalItems) * 100);
            }

            let levelBadgeHtml = "";
            let adviceText = "";

            if (calculatedScore >= 90) {
                levelBadgeHtml = `<div class="level-badge level-excellent">🌟 MỐC NĂNG LỰC: XUẤT SẮC (${calculatedScore}/100)</div>`;
                adviceText = "<b>Đánh giá:</b> Kỹ năng nghe hiểu đạt trình độ phản xạ tự nhiên, nắm bắt hoàn hảo ngữ điệu và từ vựng.";
            } else if (calculatedScore >= 70) {
                levelBadgeHtml = `<div class="level-badge level-passed">✅ MỐC NĂNG LỰC: ĐẠT (${calculatedScore}/100)</div>`;
                adviceText = "<b>Đánh giá:</b> Nghe hiểu tốt ý chính và thông tin chi tiết; cần chú ý phân biệt các từ dễ nhầm (số đếm, tên riêng).";
            } else {
                levelBadgeHtml = `<div class="level-badge level-needs-improvement">⚠️ MỐC NĂNG LỰC: CẦN CẢI THIỆN (${calculatedScore}/100)</div>`;
                adviceText = "<b>Đánh giá:</b> Chưa đạt yêu cầu phản xạ nghe hiểu; khuyến nghị tập nghe lại nhiều lần.";
            }

            if (!isFromReview) {
                lastSavedPayload = {
                    timestamp: startTimeFormatted,
                    studentName: studentInfo.studentName,
                    staffNumber: studentInfo.staffNumber,
                    birthday: studentInfo.birthday,
                    workPlace: studentInfo.workPlace,
                    department: studentInfo.department,
                    rawLessonCode: studentInfo.rawLessonCode,
                    lessonTitle: studentInfo.lessonTitle,
                    score: calculatedScore,
                    passedCount: `${correctCount}/${totalItems}`,
                    approxCount: `${incorrectCount}/${totalItems}`,
                    skippedCount: `${skippedCount}/${totalItems}`,
                    elapsedTime: formatDuration(elapsedSeconds),
                    feedback: ""
                };
                sendResultToGoogleSheet(lastSavedPayload, false);
            }

            const quizArea = document.getElementById('quiz-area');
            const reviewArea = document.getElementById('review-view');
            const resultArea = document.getElementById('result-view');

            if (quizArea) quizArea.classList.add('hidden');
            if (reviewArea) reviewArea.classList.add('hidden');

            resultArea.innerHTML = `
                <div class="result-card">
                    <b style="font-size:15px;">${message}</b>
                    <div class="score-box">${calculatedScore} <span style="font-size:18px; color:#555;">/ 100 điểm</span></div>
                    
                    ${levelBadgeHtml}
                    <br><div id="save-status-msg">✅ Đã lưu kết quả thi thành công!</div><br>
                    
                    <p style="font-size:13.5px; line-height:1.5; color:#333; margin: 5px 0 15px 0; background:#e9ecef; padding:10px; border-radius:8px; text-align:left;">
                        ${adviceText}
                    </p>

                    <div class="stats-box">
                        📊 <b>BẢNG THỐNG KÊ CHI TIẾT:</b><br>
                        • 👤 Họ tên thí sinh: <b>${studentInfo.studentName}</b><br>
                        • 🆔 Mã NV/Caddie: <b>${studentInfo.staffNumber}</b><br>
                        • 🎂 Ngày sinh: <b>${studentInfo.birthday}</b><br>
                        • ⛳ Đơn vị: <b>${studentInfo.workPlace}</b> | Bộ phận: <b>${studentInfo.department}</b><br>
                        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 6px 0;">
                        • 🕒 Thời gian bắt đầu: <b>${startTimeFormatted}</b><br>
                        • ⏱️ Thời gian thực tế: <b>${formatDuration(elapsedSeconds)}</b><br>
                        • ⏳ Thời gian còn lại: <b>${totalSeconds > 0 ? formatTime(totalSeconds) : "00:00"}</b><br>
                        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 6px 0;">
                        • ✅ Số câu trả lời ĐÚNG: <b>${correctCount} / ${totalItems}</b> câu<br>
                        • ❌ Số câu trả lời SAI: <b>${incorrectCount} / ${totalItems}</b> câu<br>
                        • ⏭️ Số câu CHƯA ĐẠT / BỎ QUA: <b>${skippedCount} / ${totalItems}</b> câu
                    </div>

                    <div class="feedback-card">
                        <label for="user-feedback">✍️ Đề xuất góp ý (nếu có) / Feedbacks & Comments:</label>
                        <textarea id="user-feedback" rows="2" placeholder="Nhập ý kiến đóng góp của bạn về bài học / Enter your comments..."></textarea>
                        <button class="btn-send-feedback" onclick="sendFeedbackOnly()">✉️ Gửi góp ý bổ sung / Submit Feedback</button>
                    </div>

                    <div class="extra-tools-card">
                        <div class="extra-tools-title">🛠️ LƯU KẾT QUẢ & TIỆN ÍCH BỔ SUNG / SAVE RESULT & ADDITIONAL TOOLS:</div>
                        <button class="btn-tool btn-screenshot" onclick="captureResultScreenshot()">📸 Chụp ảnh kết quả (Save Result Image)</button>
                        <button class="btn-tool btn-upload-drive" id="btn-drive-status" onclick="uploadResultToDrive()">☁️ Tải ảnh lên Cloud (Upload to Drive)</button>
                    </div>

                    <div class="action-buttons">
                        <button class="btn-review" onclick="startReview()">🔍 Xem lại chi tiết</button>
                        <button class="btn-retry" onclick="location.reload()">🔄 Làm lại bài test</button>
                    </div>
                </div>
            `;
            resultArea.classList.remove('hidden');
        }

        function startReview() {
            isReviewMode = true;
            currentIndex = 0;
            
            const quizArea = document.getElementById('quiz-area');
            const resultArea = document.getElementById('result-view');

            if (resultArea) resultArea.classList.add('hidden');
            if (quizArea) quizArea.classList.remove('hidden');

            const titleElem = document.getElementById('lesson-title');
            if (titleElem) titleElem.innerText = "XEM LẠI CHI TIẾT BÀI THI NGHE";

            const timerBox = document.getElementById('timer-box');
            if (timerBox) timerBox.innerText = "🔍 ĐANG Ở CHẾ ĐỘ XEM LẠI";

            let backBtn = document.getElementById('back-result-btn');
            if (!backBtn) {
                backBtn = document.createElement('button');
                backBtn.id = 'back-result-btn';
                backBtn.className = 'action-btn';
                backBtn.style.backgroundColor = '#6c757d';
                backBtn.style.color = '#ffffff';
                backBtn.style.width = '100%';
                backBtn.style.marginTop = '12px';
                backBtn.innerHTML = '📊 Quay lại Màn hình Điểm';
                backBtn.onclick = () => finishSession(lastSessionMessage || "🎉 HOÀN THÀNH BÀI KIỂM TRA NGHE!", true);
                
                const quizContainer = document.getElementById('quiz-area');
                if (quizContainer) quizContainer.appendChild(backBtn);
            } else {
                backBtn.style.display = 'block';
            }

            loadQuestion();
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { loadVoices(); };
        }

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
